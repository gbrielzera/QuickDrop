# Sobe o QuickDrop na internet: o app e o Caddy (HTTPS automático).
# Configurações ficam no arquivo .env desta pasta (copie de .env.production.example).

# Os registros do Docker crescem para sempre se ninguém limitar: aqui ficam no máximo 3 arquivos de 10 MB.
x-logging: &limited-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    restart: unless-stopped
    logging: *limited-logs
    env_file: .env
    environment:
      DEBUG: "false"
      COOKIE_SECURE: "true"
      DATABASE_URL: sqlite+aiosqlite:////data/quickdrop.db
      STORAGE_DIR: /data/storage
      # Só o Caddy (nesta rede) pode dizer qual é o IP do visitante; senão alguém burlaria os limites.
      FORWARDED_ALLOW_IPS: 172.28.0.0/24
    networks:
      - internal
    volumes:
      - quickdrop-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *limited-logs
    depends_on:
      - app
    networks:
      - internal
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  quickdrop-data:
  caddy-data:
  caddy-config:
