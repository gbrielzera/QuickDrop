# Uma vez por mês, confere se há versão nova das bibliotecas copiadas para frontend/static/js/vendor
# (o Dependabot não enxerga arquivos copiados à mão). Se houver, a verificação falha e o GitHub avisa.
name: Versões das bibliotecas copiadas

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

# O token do GitHub não precisa de nenhuma permissão além de ler o código.
permissions:
  contents: read

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/check-vendor-versions.mjs
      - run: node scripts/verify-vendor-hashes.mjs
