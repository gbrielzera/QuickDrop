{# Ícones desenhados à mão, todos com o mesmo traço (definido no CSS: .roundel svg e .note svg). #}
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  {%- if name == "plus" -%}
    <path d="M12 5v14M5 12h14"/>
  {%- elif name == "enter" -%}
    <path d="M10 7l5 5-5 5M15 12H4M14 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5"/>
  {%- elif name == "qr" -%}
    <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/>
  {%- elif name == "upload" -%}
    <path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/>
  {%- elif name == "files" -%}
    <path d="M6 3h8l5 5v13H6zM14 3v5h5M9 13h7M9 17h7"/>
  {%- elif name == "text" -%}
    <path d="M5 6h14M5 11h14M5 16h9"/>
  {%- elif name == "clips" -%}
    <path d="M9 4h6v3H9zM7 6H5v15h14V6h-2M9 12h6M9 16h6"/>
  {%- elif name == "code" -%}
    <path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/>
  {%- elif name == "braces" -%}
    <path d="M9 4c-2 0-2 1-2 3v2c0 1-1 2-2 3 1 1 2 2 2 3v2c0 2 0 3 2 3M15 4c2 0 2 1 2 3v2c0 1 1 2 2 3-1 1-2 2-2 3v2c0 2 0 3-2 3"/>
  {%- elif name == "keys" -%}
    <path d="M3 7h18v10H3zM7 11h.01M11 11h.01M15 11h.01M7 14h10"/>
  {%- elif name == "info" -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
  {%- elif name == "sun" -%}
    <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  {%- elif name == "moon" -%}
    <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
  {%- elif name == "lock" -%}
    <path d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"/>
  {%- endif -%}
</svg>
{%- endmacro %}
