{# Ícones desenhados à mão, todos com o mesmo traço (definido no CSS: .roundel svg e .note svg). #}
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  {%- if name == "plus" -%}
    <path d="M12 5v14M5 12h14"/>
  {%- elif name == "enter" -%}
    <path d="M10 7l5 5-5 5M15 12H4M14 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5"/>
  {%- elif name == "qr" -%}
    <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/>
  {%- elif name == "upload" -%}
    <path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/>
  {%- elif name == "files" -%}
    <path d="M6 3h8l5 5v13H6zM14 3v5h5M9 13h7M9 17h7"/>
  {%- elif name == "text" -%}
    <path d="M5 6h14M5 11h14M5 16h9"/>
  {%- elif name == "clips" -%}
    <path d="M9 4h6v3H9zM7 6H5v15h14V6h-2M9 12h6M9 16h6"/>
  {%- elif name == "keys" -%}
    <path d="M3 7h18v10H3zM7 11h.01M11 11h.01M15 11h.01M7 14h10"/>
  {%- elif name == "lock" -%}
    <path d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"/>
  {%- endif -%}
</svg>
{%- endmacro %}
