<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d141b">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='icons/favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='icons/apple-touch-icon.png') }}">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="preload" href="{{ url_for('static', path='fonts/barlow-latin-800-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body {% block body_attributes %}{% endblock %}>
  <noscript><p class="noscript">O QuickDrop precisa de JavaScript para criptografar seus arquivos neste aparelho. / QuickDrop needs JavaScript to encrypt your files on this device.</p></noscript>
  <header class="topbar">
    <a class="brand" href="/" aria-label="{{ app_name }}">
      <span class="roundel" aria-hidden="true">Q</span>
      <span>{{ app_name }}</span>
    </a>
    <div class="language" role="group" aria-label="Idioma / Language">
      <button type="button" data-language="pt" aria-pressed="true">PT</button>
      <button type="button" data-language="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <script type="module" src="{{ url_for('static', path='js/pwa.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
